[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["tracker/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["tracker"]
omit = ["tracker/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
